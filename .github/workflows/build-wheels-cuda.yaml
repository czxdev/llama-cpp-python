name: Build Wheels (CUDA)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload wheel assets to
        required: false
        type: string

permissions:
  contents: write

jobs:
  define_matrix:
    name: Define Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Define Job Output
        id: set-matrix
        run: |
          $matrix = @{
              'os' = @('ubuntu-22.04', 'windows-2022')
              # wheel.py-api = "py3" makes the CUDA wheel interpreter-agnostic,
              # so one builder per toolkit version is sufficient.
              'pyver' = @("3.9")
              'cuda' = @("13.2.1")
              'releasetag' = @("basic")
              'exclude' = @(
                @{ 'os' = 'windows-2022'; 'cuda' = '12.1.1' },
                @{ 'os' = 'windows-2022'; 'cuda' = '12.2.2' },
                @{ 'os' = 'windows-2022'; 'cuda' = '12.3.2' }
              )
          }

          $matrixOut = ConvertTo-Json $matrix -Compress
          Write-Output ('matrix=' + $matrixOut) >> $env:GITHUB_OUTPUT

  build_wheels:
    name: Build Wheel ${{ matrix.os }} ${{ matrix.pyver }} ${{ matrix.cuda }} ${{ matrix.releasetag == 'wheels' && 'AVX2' || matrix.releasetag }}
    needs: define_matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.define_matrix.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      CUDAVER: ${{ matrix.cuda }}
      AVXVER: ${{ matrix.releasetag }}

    steps:
      - name: Set up MSVC for CUDA 11.8
        if: runner.os == 'Windows' && matrix.cuda == '11.8.0'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Set up MSVC
        if: runner.os == 'Windows' && matrix.cuda != '11.8.0'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pyver }}
          cache: 'pip'

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          activate-environment: "llamacpp"
          python-version: ${{ matrix.pyver }}
          miniforge-version: latest
          add-pip-as-python-dependency: true
          auto-activate-base: false

      - name: Install Dependencies
        env:
          MAMBA_DOWNLOAD_FAILFAST: "0"
          MAMBA_NO_LOW_SPEED_LIMIT: "1"
        run: |
          $cudaVersion = $env:CUDAVER
          $cudaChannel = "nvidia/label/cuda-$cudaVersion"
          if ($cudaVersion -eq '11.8.0') {
            if ($IsLinux) {
              $cudaPackages = @(
                "${cudaChannel}::cuda-nvcc_linux-64=11.8.0",
                "${cudaChannel}::cuda-cccl=11.8.89",
                "${cudaChannel}::cuda-cudart=11.8.89",
                "${cudaChannel}::cuda-cudart-dev=11.8.89",
                "${cudaChannel}::cuda-driver-dev=11.8.89",
                "${cudaChannel}::libcublas=11.11.3.6",
                "${cudaChannel}::libcublas-dev=11.11.3.6"
              )
            } elseif ($IsWindows) {
              $cudaPackages = @(
                "${cudaChannel}::cuda-nvcc_win-64=11.8.0",
                "${cudaChannel}::cuda-cccl=11.8.89",
                "${cudaChannel}::cuda-cudart=11.8.89",
                "${cudaChannel}::cuda-cudart-dev=11.8.89",
                "${cudaChannel}::libcublas=11.11.3.6",
                "${cudaChannel}::libcublas-dev=11.11.3.6"
              )
            } else {
              throw 'Unsupported CUDA wheel build platform'
            }
            mamba install -y --channel-priority flexible --override-channels -c $cudaChannel $cudaPackages
          } elseif ($IsLinux) {
            mamba install -y --channel-priority flexible --override-channels -c $cudaChannel "${cudaChannel}::cuda-toolkit=$cudaVersion" "${cudaChannel}::cuda-nvcc_linux-64" "${cudaChannel}::cuda-cccl" "${cudaChannel}::cuda-cudart" "${cudaChannel}::cuda-cudart-dev"
          } elseif ($IsWindows) {
            if ($cudaVersion -like '12.5.*' -or [version]$cudaVersion -ge [version]"13.0") {
              # The Windows 12.5+ toolkit meta-package pulls compiler activation
              # scripts that overflow cmd.exe after MSVC is already initialized.
              mamba install -y --channel-priority flexible --override-channels -c $cudaChannel "${cudaChannel}::cuda-nvcc_win-64" "${cudaChannel}::cuda-cccl" "${cudaChannel}::cuda-libraries-dev=$cudaVersion" "${cudaChannel}::cuda-cudart" "${cudaChannel}::cuda-cudart-dev"
            } else {
              mamba install -y --channel-priority flexible --override-channels -c $cudaChannel "${cudaChannel}::cuda-toolkit=$cudaVersion" "${cudaChannel}::cuda-nvcc_win-64" "${cudaChannel}::cuda-cccl" "${cudaChannel}::cuda-cudart" "${cudaChannel}::cuda-cudart-dev"
            }
          } else {
            throw 'Unsupported CUDA wheel build platform'
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($IsWindows) {
            python -m pip install build wheel ninja
          } else {
            sudo apt-get update
            sudo apt-get install -y patchelf
            python -m pip install auditwheel build wheel
          }

      - name: Build Wheel
        run: |
          $pathSeparator = if ($IsWindows) { ';' } else { ':' }
          if ($IsWindows) {
            $cudaRoot = Join-Path $env:CONDA_PREFIX 'Library'
          } elseif (Test-Path (Join-Path $env:CONDA_PREFIX 'targets/x86_64-linux/include/cuda_runtime.h')) {
            $cudaRoot = Join-Path $env:CONDA_PREFIX 'targets/x86_64-linux'
          } else {
            $cudaRoot = $env:CONDA_PREFIX
          }

          $env:CUDA_PATH = $cudaRoot
          $env:CUDA_HOME = $cudaRoot
          $env:CUDAToolkit_ROOT = $cudaRoot
          $env:CUDA_TOOLKIT_ROOT_DIR = $cudaRoot
          $cudaHostCompilerArg = ''
          $cudaRootCmake = $cudaRoot.Replace('\', '/')
          $env:CMAKE_ARGS = "-DCUDAToolkit_ROOT=$cudaRootCmake -DCUDA_TOOLKIT_ROOT_DIR=$cudaRootCmake"
          if ($IsLinux) {
            if ([version]$env:CUDAVER -lt [version]"12.0" -and (Test-Path '/usr/bin/g++-11')) {
              $env:CC = '/usr/bin/gcc-11'
              $env:CXX = '/usr/bin/g++-11'
              $env:CUDAHOSTCXX = '/usr/bin/g++-11'
              $cudaHostCompilerArg = " -DCMAKE_CUDA_HOST_COMPILER=$env:CUDAHOSTCXX"
            } elseif (Test-Path '/usr/bin/g++-12') {
              $env:CC = '/usr/bin/gcc-12'
              $env:CXX = '/usr/bin/g++-12'
              $env:CUDAHOSTCXX = '/usr/bin/g++-12'
              $cudaHostCompilerArg = " -DCMAKE_CUDA_HOST_COMPILER=$env:CUDAHOSTCXX"
            }
            $env:CMAKE_ARGS = "-DCUDAToolkit_ROOT=$cudaRoot -DCUDA_TOOLKIT_ROOT_DIR=$cudaRoot$cudaHostCompilerArg"
            $env:CPATH = "$cudaRoot/include$pathSeparator$env:CPATH"
            $env:CPLUS_INCLUDE_PATH = "$cudaRoot/include$pathSeparator$env:CPLUS_INCLUDE_PATH"
            $env:LIBRARY_PATH = "$cudaRoot/lib$pathSeparator$env:CONDA_PREFIX/lib$pathSeparator$env:LIBRARY_PATH"
            $env:LD_LIBRARY_PATH = "$cudaRoot/lib$pathSeparator$env:CONDA_PREFIX/lib$pathSeparator$env:LD_LIBRARY_PATH"
            $cudaLibraryPaths = @(
              (Join-Path $cudaRoot 'lib'),
              (Join-Path $cudaRoot 'lib64'),
              (Join-Path $env:CONDA_PREFIX 'lib')
            ) | Where-Object { Test-Path $_ }
            Write-Output "CUDA_LIBRARY_PATHS=$($cudaLibraryPaths -join ':')" >> $env:GITHUB_ENV
          } elseif ($IsWindows) {
            $ninjaPath = ((Get-Command ninja -ErrorAction Stop).Source).Replace('\', '/')
            $env:CMAKE_GENERATOR = 'Ninja'
            $env:CMAKE_MAKE_PROGRAM = $ninjaPath
            $env:PATH = "$(Join-Path $cudaRoot 'bin')$pathSeparator$env:PATH"
          }

          if ($IsWindows) {
            $nvccCandidates = @(
              (Join-Path $cudaRoot 'bin\nvcc.exe'),
              (Join-Path $env:CONDA_PREFIX 'Library\bin\nvcc.exe'),
              (Join-Path $env:CONDA_PREFIX 'bin\nvcc.exe')
            )
          } else {
            $nvccCandidates = @(
              (Join-Path $env:CONDA_PREFIX 'bin/nvcc'),
              (Join-Path $env:CONDA_PREFIX 'targets/x86_64-linux/bin/nvcc')
            )
          }
          $nvccPath = $nvccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nvccPath) {
            throw 'Failed to find nvcc in the conda environment'
          }
          $env:CUDACXX = $nvccPath
          $env:PATH = "$(Split-Path $nvccPath)$pathSeparator$env:PATH"
          if ($IsWindows) {
            $nvccPathCmake = $nvccPath.Replace('\', '/')
            $env:CUDACXX = $nvccPathCmake
            $env:CMAKE_ARGS = "-DCMAKE_CUDA_COMPILER=$nvccPathCmake -DCMAKE_CUDA_COMPILER_ARG1=-allow-unsupported-compiler -DCMAKE_MAKE_PROGRAM=$env:CMAKE_MAKE_PROGRAM $env:CMAKE_ARGS"
          }
          $nvccVersion = ((& $nvccPath --version) | Select-String 'release ([0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if (-not $nvccVersion) {
            throw 'Failed to detect the installed CUDA toolkit version'
          }
          $cudaTagVersion = $nvccVersion.Replace('.','')
          $env:VERBOSE = '1'
          $cudaArchs = "60-real;61-real;70-real;75-real;80-real;86-real;89-real;90-real;90-virtual"
          if ([version]$nvccVersion -lt [version]"12.0") {
            # CUDA 11.8 cannot compile llama.cpp's Hopper PDL device calls.
            $cudaArchs = "60-real;61-real;70-real;75-real;80-real;86-real;89-real"
          } elseif ([version]$nvccVersion -ge [version]"13.0") {
            # CUDA 13 dropped offline compilation support for pre-Turing targets.
            $cudaArchs = "75-real;80-real;86-real;89-real;90-real;90-virtual"
          }
          if ([version]$nvccVersion -ge [version]"12.8") {
            $cudaArchs = "$cudaArchs;120a-real"
          }
          # Build real cubins for the supported GPUs and keep
          # one forward-compatible PTX target instead of embedding PTX for every
          # SM. This keeps the wheel under GitHub's 2 GiB release-asset limit.
          $env:CMAKE_ARGS = "-DGGML_CUDA_FORCE_MMQ=ON -DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=$cudaArchs -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler -DCMAKE_CUDA_FLAGS_INIT=-allow-unsupported-compiler $env:CMAKE_ARGS"
          $env:CMAKE_ARGS = $env:CMAKE_ARGS + ' -DGGML_NATIVE=OFF -DGGML_AVX512=OFF'
          $env:CMAKE_ARGS = $env:CMAKE_ARGS + ' -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON'
          
          if ($IsLinux) {
            $env:CMAKE_ARGS = $env:CMAKE_ARGS + ' -DGGML_OPENMP=OFF'
          }
          python -m build --wheel
          # Publish tags that reflect the actual installed toolkit version.
          Write-Output "CUDA_VERSION=$cudaTagVersion" >> $env:GITHUB_ENV

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p wheelhouse
          export LD_LIBRARY_PATH="$PWD/llama_cpp/lib:${CUDA_LIBRARY_PATHS}:${LD_LIBRARY_PATH:-}"
          auditwheel_bin="${CONDA}/envs/llamacpp/bin/auditwheel"
          "${auditwheel_bin}" repair \
            --exclude libcuda.so \
            --exclude libcuda.so.1 \
            --exclude libcudart.so.11.0 \
            --exclude libcudart.so.12 \
            --exclude libcudart.so.13 \
            --exclude libcublas.so.11 \
            --exclude libcublas.so.12 \
            --exclude libcublas.so.13 \
            --exclude libcublasLt.so.11 \
            --exclude libcublasLt.so.12 \
            --exclude libcublasLt.so.13 \
            -w wheelhouse \
            dist/*.whl
          rm dist/*.whl
          cp wheelhouse/*.whl dist/
          "${auditwheel_bin}" show dist/*.whl

      - name: Add CUDA runtime RUNPATHs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          shopt -s nullglob

          # ------------------------------------------------------------
          # 1. Find the repaired wheel
          # ------------------------------------------------------------
          wheels=(dist/*.whl)

          if (( ${#wheels[@]} != 1 )); then
              echo "Expected exactly one wheel in dist/, found ${#wheels[@]}"
              printf '  %s\n' "${wheels[@]}"
              exit 1
          fi

          wheel="$(realpath "${wheels[0]}")"
          echo "Processing wheel: $wheel"

          # CUDA 13.2.1 -> 13
          cuda_major="${CUDAVER%%.*}"

          if [[ ! "$cuda_major" =~ ^[0-9]+$ ]]; then
              echo "Failed to determine CUDA major version from CUDAVER=$CUDAVER"
              exit 1
          fi

          echo "CUDA major version: $cuda_major"

          # ------------------------------------------------------------
          # 2. Unpack wheel
          #
          # wheel_root corresponds to site-packages after installation.
          #
          # For example:
          #
          # wheel_root/
          # ├── llama_cpp/
          # │   ├── _ctypes_extensions.py
          # │   └── lib/
          # │       ├── libllama.so
          # │       ├── libggml.so
          # │       └── libggml-cuda.so
          # └── ...
          #
          # ------------------------------------------------------------
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          unpack_dir="$tmpdir/unpacked"
          mkdir -p "$unpack_dir"

          python -m wheel unpack "$wheel" -d "$unpack_dir"

          wheel_roots=("$unpack_dir"/*)

          if (( ${#wheel_roots[@]} != 1 )); then
              echo "Expected exactly one unpacked wheel directory"
              printf '  %s\n' "${wheel_roots[@]}"
              exit 1
          fi

          wheel_root="$(realpath "${wheel_roots[0]}")"

          echo "Wheel root: $wheel_root"

          # ------------------------------------------------------------
          # 3. CUDA runtime libraries supplied externally
          #
          # libcuda is intentionally NOT included here.
          #
          # libcuda.so comes from the NVIDIA kernel driver and should be
          # resolved by the system dynamic loader rather than from a
          # Python/Conda CUDA runtime package.
          #
          # The other CUDA libraries may be provided by either:
          #
          #   pip:
          #     <site-packages>/nvidia/cu13/lib
          #
          #   conda:
          #     <env>/lib
          #
          # ------------------------------------------------------------
          cuda_runtime_regex='^(libcudart|libcublas|libcublasLt|libcusparse|libcusolver|libcurand|libnvrtc|libnvJitLink)\.so([.][0-9]+)*$'

          patched_count=0

          # ------------------------------------------------------------
          # 4. Scan every ELF in the wheel
          # ------------------------------------------------------------
          while IFS= read -r -d '' elf; do

              # Ignore non-ELF files even if their filename contains ".so".
              if ! file -Lb "$elf" | grep -q '^ELF '; then
                  continue
              fi

              echo
              echo "============================================================"
              echo "ELF: ${elf#$wheel_root/}"
              echo "============================================================"

              needed="$(patchelf --print-needed "$elf" 2>/dev/null || true)"

              printf '%s\n' "$needed" | sed 's/^/  NEEDED: /'

              # --------------------------------------------------------
              # Check whether this ELF DIRECTLY depends on a CUDA runtime
              # library.
              #
              # RUNPATH is not transitive, therefore the RUNPATH must be
              # attached to the ELF that actually has:
              #
              #     DT_NEEDED libcublas.so.X
              #
              # rather than blindly patching only libllama.so.
              # --------------------------------------------------------
              if ! printf '%s\n' "$needed" | grep -Eq "$cuda_runtime_regex"; then
                  echo "  No direct CUDA runtime dependency; leaving RUNPATH unchanged."
                  continue
              fi

              elf_dir="$(dirname "$elf")"

              # --------------------------------------------------------
              # 5. Calculate paths relative to THIS ELF automatically
              #
              # wheel_root == site-packages
              #
              # Example for:
              #
              #   llama_cpp/lib/libggml-cuda.so
              #
              # elf_dir -> site-packages:
              #
              #   ../..
              #
              # Therefore:
              #
              # pip NVIDIA runtime:
              #
              #   $ORIGIN/../../nvidia/cu13/lib
              #
              # Conda runtime:
              #
              #   $ORIGIN/../../../..
              #
              # The calculation below also works if a CUDA-dependent ELF
              # moves to another directory in a future llama.cpp version.
              # --------------------------------------------------------
              read -r pip_cuda_rel conda_cuda_rel < <(
                  python - "$elf_dir" "$wheel_root" "$cuda_major" <<'PY'
          import os
          import sys

          elf_dir = os.path.realpath(sys.argv[1])
          wheel_root = os.path.realpath(sys.argv[2])
          cuda_major = sys.argv[3]

          # Relative path from the ELF directory to site-packages.
          to_site_packages = os.path.relpath(wheel_root, elf_dir)

          # pip package layout:
          #
          #   <site-packages>/nvidia/cu13/lib
          #
          pip_cuda = os.path.normpath(
              os.path.join(
                  to_site_packages,
                  "nvidia",
                  f"cu{cuda_major}",
                  "lib",
              )
          )

          # Conda layout:
          #
          #   <env>/lib/pythonX.Y/site-packages
          #                   ^^^^^^^^^^^^^^^^^
          #                   wheel_root
          #
          # From site-packages:
          #
          #   ../.. -> <env>/lib
          #
          conda_cuda = os.path.normpath(
              os.path.join(
                  to_site_packages,
                  "..",
                  "..",
              )
          )

          print(pip_cuda, conda_cuda)
          PY
              )

              pip_cuda_rpath="\$ORIGIN/${pip_cuda_rel}"
              conda_cuda_rpath="\$ORIGIN/${conda_cuda_rel}"

              echo "  pip CUDA RUNPATH:   $pip_cuda_rpath"
              echo "  conda CUDA RUNPATH: $conda_cuda_rpath"

              # --------------------------------------------------------
              # 6. Preserve auditwheel-generated relative RUNPATH entries
              #
              # auditwheel may already have added something like:
              #
              #   $ORIGIN
              #   $ORIGIN/../../llama_cpp_python.libs
              #
              # Keep those.
              #
              # Do NOT preserve absolute paths such as:
              #
              #   /home/runner/miniconda3/envs/llamacpp/lib
              #
              # because they are valid only on the CI builder.
              # --------------------------------------------------------
              old_rpath="$(patchelf --print-rpath "$elf" 2>/dev/null || true)"

              echo "  Old RUNPATH: ${old_rpath:-<empty>}"

              declare -a new_rpaths=()
              declare -A seen_rpaths=()

              add_rpath() {
                  local path="$1"

                  [[ -n "$path" ]] || return

                  if [[ -z "${seen_rpaths[$path]+x}" ]]; then
                      seen_rpaths["$path"]=1
                      new_rpaths+=("$path")
                  fi
              }

              if [[ -n "$old_rpath" ]]; then
                  IFS=':' read -ra old_entries <<< "$old_rpath"

                  for entry in "${old_entries[@]}"; do
                      case "$entry" in
                          '$ORIGIN'|'$ORIGIN/'*|'${ORIGIN}'|'${ORIGIN}/'*)
                              add_rpath "$entry"
                              ;;
                          "")
                              ;;
                          *)
                              echo "  Dropping non-portable RUNPATH entry: $entry"
                              ;;
                      esac
                  done
              fi

              # Keep same-directory lookup available.
              add_rpath '$ORIGIN'

              # NVIDIA pip CUDA package:
              #
              #   site-packages/nvidia/cu<major>/lib
              add_rpath "$pip_cuda_rpath"

              # Conda CUDA runtime:
              #
              #   <env>/lib
              add_rpath "$conda_cuda_rpath"

              new_rpath="$(
                  IFS=:
                  echo "${new_rpaths[*]}"
              )"

              echo "  New RUNPATH: $new_rpath"

              # patchelf normally writes DT_RUNPATH rather than legacy
              # DT_RPATH, which is what we want here.
              patchelf --set-rpath "$new_rpath" "$elf"

              patched_count=$((patched_count + 1))

              # Clear associative array before next ELF.
              unset seen_rpaths
              unset new_rpaths

          done < <(find "$wheel_root" -type f -print0)

          echo
          echo "Patched CUDA-dependent ELF files: $patched_count"

          if (( patched_count == 0 )); then
              echo "ERROR: no ELF with a direct CUDA runtime dependency was found."
              echo "This probably means the CUDA dependency layout changed."
              exit 1
          fi

          # ------------------------------------------------------------
          # 7. Verify the modified ELF files before packing
          # ------------------------------------------------------------
          echo
          echo "================ ELF verification ================"

          while IFS= read -r -d '' elf; do
              if ! file -Lb "$elf" | grep -q '^ELF '; then
                  continue
              fi

              needed="$(patchelf --print-needed "$elf" 2>/dev/null || true)"

              if printf '%s\n' "$needed" | grep -Eq "$cuda_runtime_regex"; then
                  echo
                  echo "${elf#$wheel_root/}"

                  echo "  CUDA dependencies:"
                  printf '%s\n' "$needed" \
                      | grep -E "$cuda_runtime_regex" \
                      | sed 's/^/    /'

                  echo "  RUNPATH:"
                  patchelf --print-rpath "$elf" \
                      | sed 's/^/    /'
              fi
          done < <(find "$wheel_root" -type f -print0)

          # ------------------------------------------------------------
          # 8. Remove original wheel and repack
          #
          # `wheel pack` regenerates RECORD hashes/sizes, which is
          # required because the ELF binaries have been modified.
          # ------------------------------------------------------------
          rm -f "$wheel"

          python -m wheel pack "$wheel_root" -d dist

          final_wheels=(dist/*.whl)

          if (( ${#final_wheels[@]} != 1 )); then
              echo "Expected exactly one repacked wheel, found ${#final_wheels[@]}"
              printf '  %s\n' "${final_wheels[@]}"
              exit 1
          fi

          final_wheel="$(realpath "${final_wheels[0]}")"

          echo
          echo "Final wheel:"
          echo "  $final_wheel"

          # ------------------------------------------------------------
          # 9. Final auditwheel inspection
          # ------------------------------------------------------------
          auditwheel_bin="${CONDA}/envs/llamacpp/bin/auditwheel"

          "$auditwheel_bin" show "$final_wheel"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          files: dist/*
          # Set tag_name to <tag>-cu<cuda_version>.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-cu${{ env.CUDA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
